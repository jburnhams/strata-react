name: NPM Publish Package

on:
  # `published`, not `created`: action-gh-release makes a draft and then publishes it, and a
  # draft's creation fires no `created` event.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'

      # Ensure npm 11.5.1 or later is installed
      - name: Update npm
        run: npm install -g npm@latest
      - run: npm ci
      # test:all runs the integration suite, which drives strata-visual in real Chromium on a
      # throwaway app. Without the browser 0.1.7 and 0.1.8 failed here and never reached npm.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:all
      - run: npm publish
